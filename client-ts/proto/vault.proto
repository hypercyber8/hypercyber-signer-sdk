syntax = "proto3";
package vault.v1;
option go_package = "github.com/hypercyber8/hypercyber-signer-sdk/proto/vault/v1;vaultv1";

// All wallets use threshold ECDSA. The former `version` field selected between
// local single-key and threshold custody; local custody is gone, so there is
// nothing left to select and the field is reserved rather than reused.
message CreateRequest {
  string markup    = 1;
  string wallet_id = 2;
  reserved 3;
  reserved "version";
}

// WalletAttestation is one signer node's signed assertion that it holds a share
// of this wallet.
//
// Verify these CLIENT-SIDE against node public keys learned out of band. A
// client that skips this is taking the frontend's word that the address is
// backed by a real threshold sharing — and a compromised frontend can generate a
// key it alone knows and hand out its address instead.
message WalletAttestation {
  int32 party_id = 1;
  bytes signature = 2;
}

message CreateResponse {
  string wallet_id    = 1;
  string ecdsa_pubkey = 2;
  // attestations is populated on a distributed deployment: one entry per signer
  // node that confirmed it holds a share of this wallet. Empty on a single-host
  // deployment, where there is nothing independent to attest.
  //
  // A client that receives fewer than `threshold` valid attestations should
  // treat the address as unverified and NOT fund it.
  repeated WalletAttestation attestations = 3;
  // group_pubkey is the 33-byte compressed group key. It is part of what the
  // attestations commit to, so a client needs it to check them.
  bytes  group_pubkey = 4;
  int32  threshold    = 5;
  repeated int32 all_ids = 6;
}

message GetWalletRequest { string wallet_id = 1; }
message GetWalletResponse {
  string wallet_id = 1;
  string markup = 2;
  string address = 3;
  bytes group_pubkey = 4;
  int32 threshold = 5;
  repeated int32 all_ids = 6;
}

message SignByWalletRequest {
  string wallet_id   = 1;
  string request_id  = 2;
  string network     = 3;
  bytes  chain_id    = 4;
  bytes  transaction = 6;
}

message SignByWalletResponse {
  bytes signed_transaction = 1;
}

message SignByAddressRequest {
  string address     = 1;
  string request_id  = 2;
  string network     = 3;
  bytes  chain_id    = 4;
  bytes  transaction = 6;
}

message SignByAddressResponse {
  bytes signed_transaction = 1;
}

message TypedDataRequest {
  string request_id       = 1;
  string network          = 2;
  // chain_id is routing and audit metadata only; it does NOT enter the signed
  // pre-image. EIP-712 already carries the chain id inside the domain, and the
  // vault signs keccak(0x19 || 0x01 || domain_separator || typed_data_hash) —
  // so this field cannot change what gets signed and is optional.
  //
  // Authorization for this RPC attaches to domain_separator, which the server
  // matches against the calling credential's allowed-typed-data-domains.
  bytes  chain_id         = 3;
  bytes  address          = 4;
  // domain_separator and typed_data_hash are each exactly 32 bytes; the server
  // rejects any other length rather than hashing a differently-shaped pre-image.
  bytes  domain_separator = 5;
  bytes  typed_data_hash  = 6;
  // action describes WHAT is being signed, so the server can authorize it rather
  // than only sign it. Optional; see HyperliquidAction.
  HyperliquidAction action = 7;
  reserved 8, 9;
  reserved "message", "calibur";
}

message TypedDataByWalletRequest {
  string wallet_id        = 1;
  string request_id       = 2;
  string network          = 3;
  bytes  chain_id         = 4;
  bytes  domain_separator = 5;
  bytes  typed_data_hash  = 6;
  HyperliquidAction action = 7;
}

// HyperliquidAction is the structured form of an L1 action, so the vault can
// apply policy to what is actually being signed instead of to an opaque hash.
//
// The vault does NOT re-encode this. action_msgpack is the CALLER'S OWN encoding
// — the exact bytes it is about to hash — and the vault checks that those bytes
// derive the domain_separator and typed_data_hash in this same request. That
// makes the binding cryptographic rather than declarative: a caller cannot
// describe one action and have another signed, because the description and the
// signature pre-image are the same bytes.
//
// It also means no encoder agreement is needed. An earlier attempt required the
// vault to reproduce the SDK's msgpack exactly — insertion-ordered map keys,
// compact ints, str16-to-str8 rewriting — and stalled there. Nothing here
// depends on that.
message HyperliquidAction {
  // action_msgpack is the caller's msgpack encoding of the action object.
  bytes  action_msgpack = 1;
  // nonce is appended big-endian when computing the action hash.
  uint64 nonce = 2;
  // vault_address is the sub-account this acts on behalf of, or empty.
  string vault_address = 3;
  // expires_after is optional; has_expires_after distinguishes "zero" from
  // "absent", which produce different action hashes.
  uint64 expires_after = 4;
  bool   has_expires_after = 5;
  // is_mainnet selects the phantom agent source tag. It does NOT change the
  // domain: the L1 domain's chainId is 1337 on both networks.
  bool   is_mainnet = 6;
}

message RSVResponse {
  bytes r = 1;
  bytes s = 2;
  int32 v = 3;
}

// Import is gone. Threshold custody has no trusted-dealer or resharing
// primitive, so an externally-generated full key cannot be split into a t-of-n
// sharing, and accepting one would put a whole private key inside a system whose
// guarantee is that no node holds one. Clients still calling it receive
// UNIMPLEMENTED from gRPC itself. Wallets are created via DKG with Create.
service VaultService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  rpc SignByWallet(SignByWalletRequest) returns (SignByWalletResponse);
  rpc SignByAddress(SignByAddressRequest) returns (SignByAddressResponse);
  rpc TypedData(TypedDataRequest) returns (RSVResponse);
  rpc TypedDataByWallet(TypedDataByWalletRequest) returns (RSVResponse);
}
